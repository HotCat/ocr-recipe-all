[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openfrp-vision"
version = "0.1.0"
description = "Experimental PySide6 OpenGL FRP-style vision workbench"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "numpy>=1.26",
  "opencv-python>=4.9",
]

[project.optional-dependencies]
ocr = [
  "paddleocr>=2.7",
  "paddlepaddle>=2.6",
]

[project.scripts]
openfrp-vision = "openfrp_vision.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
